<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encomenda confirmada — Torra Lusa</title>
  <meta name="description" content="Detalhes da tua encomenda simulada Torra Lusa, com resumo dos produtos, entrega estimada e próximos passos.">
  <meta name="theme-color" content="#f6efe4">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://torra-lusa.vercel.app/confirmacao.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:site_name" content="Torra Lusa">
  <meta property="og:title" content="Encomenda confirmada — Torra Lusa">
  <meta property="og:description" content="O resumo da tua encomenda simulada, com entrega estimada e próximos passos.">
  <meta property="og:url" content="https://torra-lusa.vercel.app/confirmacao.html">
  <meta property="og:image" content="https://torra-lusa.vercel.app/images/beans-sack.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="confirmacao">
  <div data-site-header></div>

  <main id="conteudo">
    <section class="confirmation-page" aria-labelledby="confirmation-title">
      <div class="container">
        <div data-confirmation-content>
          <noscript>
            <div class="confirmation-empty">
              <div class="confirmation-mark">
                <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 8.5h13l-1 11h-11l-1-11Z"/><path d="M9 8.5V6a3 3 0 0 1 6 0v2.5"/></svg>
              </div>
              <span class="eyebrow">Confirmação</span>
              <h1 id="confirmation-title">A confirmação precisa de JavaScript.</h1>
              <p>Ativa o JavaScript para consultar os detalhes da encomenda simulada. Se precisares de ajuda, fala connosco por email ou WhatsApp.</p>
              <div class="confirmation-cta">
                <a class="btn" href="contactos.html">Falar connosco</a>
                <a class="btn btn--outline" href="loja.html">Voltar à loja</a>
              </div>
            </div>
          </noscript>
        </div>

        <section class="confirmation-invite" aria-labelledby="confirmation-newsletter-title">
          <div class="confirmation-invite__inner">
            <div>
              <span class="eyebrow">Enquanto o café arrefece</span>
              <h2 id="confirmation-newsletter-title">Uma carta por mês, sem ruído.</h2>
              <p>Novos lotes, notas de torra e histórias de origem. 10 % na primeira compra para quem se junta à mesa.</p>
            </div>
            <div class="confirmation-invite__actions">
              <form class="newsletter-form" data-newsletter-form data-source="confirmacao" novalidate>
                <label class="sr-only" for="confirmation-news-email">O teu email</label>
                <div class="newsletter-form__row">
                  <input id="confirmation-news-email" name="email" type="email" placeholder="o.teu@email.pt" autocomplete="email" required>
                  <button class="btn" type="submit" aria-label="Subscrever a newsletter"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"/><path d="m13 6 6 6-6 6"/></svg></button>
                </div>
                <p class="form-message" data-newsletter-message role="status"></p>
              </form>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-site-cart></div>
  <div data-site-floating></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
