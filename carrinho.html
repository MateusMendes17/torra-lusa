<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho — Torra Lusa</title>
  <meta name="description" content="Revê o teu carrinho Torra Lusa, ajusta quantidades, aplica um código promocional e avança para o checkout simulado.">
  <meta name="theme-color" content="#f6efe4">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://www.torralusa.pt/carrinho.html">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_PT">
  <meta property="og:site_name" content="Torra Lusa">
  <meta property="og:title" content="O teu carrinho — Torra Lusa">
  <meta property="og:description" content="Revê a tua seleção de café, cápsulas e acessórios.">
  <meta property="og:url" content="https://www.torralusa.pt/carrinho.html">
  <meta property="og:image" content="https://www.torralusa.pt/images/beans-sack.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="carrinho">
  <div data-site-header></div>

  <main id="conteudo">
    <section class="cart-page" aria-labelledby="carrinho-title">
      <div class="container">
        <nav aria-label="Trilho de navegação">
          <ol class="breadcrumbs">
            <li><a href="index.html">Início</a></li>
            <li><a href="loja.html">Loja</a></li>
            <li><span aria-current="page">Carrinho</span></li>
          </ol>
        </nav>

        <div class="cart-page__head mt-3">
          <div>
            <span class="eyebrow">Quase na chávena</span>
            <h1 id="carrinho-title">O teu carrinho</h1>
          </div>
          <p data-cart-head-meta>Os teus produtos guardados neste dispositivo.</p>
        </div>

        <div class="cart-layout">
          <div class="cart-content" data-cart-page-content>
            <noscript>
              <div class="cart-empty__card">
                <h2>O carrinho precisa de JavaScript.</h2>
                <p>Ativa o JavaScript para rever os produtos e finalizar a encomenda. Podes também falar connosco por email ou WhatsApp.</p>
                <a class="btn mt-3" href="contactos.html">Falar connosco</a>
              </div>
            </noscript>
          </div>
          <aside data-cart-page-summary aria-label="Resumo do carrinho"></aside>
        </div>
      </div>
    </section>

    <section class="section section--paper section--tight" aria-labelledby="cart-help-title">
      <div class="container between" style="flex-wrap:wrap;gap:1.5rem">
        <div>
          <span class="eyebrow">Uma dúvida antes de pagar?</span>
          <h2 class="section-title" id="cart-help-title" style="font-size:clamp(1.8rem,1.4rem+1.6vw,2.8rem);margin-top:.7rem">Estamos do lado de cá.</h2>
          <p class="text-small mt-2" style="max-width:48ch;color:var(--ink-soft)">Portes, moagem, subscrições ou devoluções: respondemos em menos de um dia útil.</p>
        </div>
        <div class="cluster">
          <a class="btn" href="contactos.html">Falar connosco</a>
          <a class="btn btn--outline" href="faq.html">Perguntas frequentes</a>
        </div>
      </div>
    </section>
  </main>

  <div data-site-footer></div>
  <div data-site-cart></div>
  <div data-site-floating></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
